<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>Pixel Editor</title>
</head>

<body>
  <h1 class="titulo">Editor de Pixel</h1>

  <aside id="contenedorHerramientas" class="menuFlotante contenedorMenus">
    <button class="arrastre">:::</button>
    <ul id="listaDeHerramientas">
      <li id="lapiz"><img src="img/lapiz.png" alt="lapiz""></li>
      <li id="borrador"><img src="img/borrador.png" alt="borrador"></li>


      <li><input type="color" id="colorLapiz" value="#000000" /></li>

      <li>
        <div class="tamañoLapiz">
          <span>Tamaño Lapiz</span>
          <select name="Lapiz" id="Tamaño_lapiz">
            <option value="1" selected>1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </div>
              </li>
      <li>

        <div class="EspacioDeTrabajo">
          <span>Tamaño Canvas</span>
          <select name="celdas" id="CantidadDeCuadros">
            <option value="4" selected>4</option>
            <option value="8">8</option>
            <option value="16">16</option>
            <option value="32">32</option>
            <option value="64">64</option>
            <option value="128">128</option>
          </select>
        </div>
      </li>
      <li id="btn_QuitarGrillas">Quitar Grillas</li>
      <li id="rellenar">Rellenar</li>
      <li id="gotero">Gotero</li>
      <li id="limpiarCanva">Limpiar Canvas</li>
      <li id="deshacer">Deshacer</li>
      <li id="rehacer">Rehacer</li>


    </ul>
  </aside>

  <aside id="menuGuardado" class="contenedorMenus">
    <button class="arrastre">:::</button>

    <ul id="opcionesGuardado">
      <li>
        <span>Elije el formato</span><select id="formatoImagen">
          <option value="png">Png</option>
          <option value="jpeg">Jpg</option>
          <option value="svg">Svg</option>
        </select>
      </li>

      <li>
        <span>Elije el tamaño</span>
        <input type="number" id="tamañoImagen" placeholder="512" value="512"/>
      </li>
      <li id="guardarImagen">Guardar</li>
    </ul>
  </aside>

  <aside id="menuColores" class="contenedorMenus">
    <button class="arrastre">:::</button>
  </aside>

   <aside id="menuFiguras" class="contenedorMenus">
    <button class="arrastre">:::</button>
      <ul>
        <li data-forma="triangulo">Triangulo</li>
        <li data-forma="circulo">Circulo</li>
        <li data-forma="cuadrado">Cuadrado</li>
        <li data-forma="recta">Linea recta</li>
        <li data-forma="curva">Linea Curva</li>
      </ul>
  </aside>

  <div class="contenedorCanvas">
    <canvas id="EspacioDeCanvas" width="512" height="512"></canvas>
    <canvas id="gridCanvas" width="512" height="512"></canvas>
    <canvas id="predibujadoCanvas" width="512" height="512"></canvas>

  </div>
  <script type="module" src="script/main.js"></script>
</body>

</html>
